<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>帷幄 · Tent</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="layout" id="main-layout">
    <!-- 左栏：纸研 Node Explorer — 品牌 + 弱化工具 + 安静树 -->
    <aside class="rail tree-panel" id="tree-panel" aria-label="Node Explorer">
      <header class="rail-brand">
        <div class="brand-block">
          <h1 class="brand">帷幄</h1>
          <p class="brand-sub">纸研 · Editorial</p>
        </div>
        <div class="rail-brand-meta">
          <span id="health-pill" class="pill off" title="Local Service 状态">服务离线</span>
          <button type="button" id="btn-collapse-left" class="icon-btn" title="收起左侧栏" aria-label="收起左侧栏" aria-controls="tree-panel">‹</button>
        </div>
      </header>

      <div class="rail-workspace">
        <label class="sr-only" for="workspace-select">前台工作区</label>
        <select id="workspace-select" title="前台工作区"></select>
        <div class="rail-workspace-actions">
          <button type="button" id="btn-open-ws" class="ghost-btn" title="打开工作区">打开</button>
          <button type="button" id="btn-refresh" class="ghost-btn" title="刷新">刷新</button>
          <button type="button" id="btn-card" class="ghost-btn" title="发出上下文卡">发卡</button>
          <button type="button" id="btn-float" class="ghost-btn" title="浮动控件">浮动</button>
        </div>
      </div>

      <div class="rail-tools">
        <div class="create-row">
          <select id="create-type" title="可协调一级类型" aria-label="协作框类型"></select>
          <button type="button" id="btn-new-box" class="ghost-btn" title="一键新建协作框">新建</button>
          <button type="button" id="btn-new-note" class="ghost-btn" title="新建普通笔记">笔记</button>
        </div>
        <div class="search-row">
          <input id="search-input" placeholder="搜索标题 / 正文" />
          <button type="button" id="btn-search" class="ghost-btn">搜索</button>
        </div>
        <ul id="search-hits" class="card-list search-hits"></ul>
      </div>

      <ul id="tree" class="tree" aria-label="概念树"></ul>
      <p id="status-line" class="status-line rail-status" aria-live="polite"></p>
    </aside>

    <div
      class="splitter"
      id="splitter-left"
      role="separator"
      aria-orientation="vertical"
      aria-label="调整左侧栏宽度"
      aria-controls="tree-panel"
      tabindex="0"
    ></div>

    <!-- 中栏：文稿台 / 阅读柱 -->
    <main class="stage main-panel" id="main-panel" aria-label="文档编辑区">
      <div class="stage-chrome">
        <div class="main-rail-toggles" id="rail-toggles">
          <button type="button" id="btn-expand-left" class="icon-btn rail-toggle" hidden title="展开左侧栏" aria-label="展开左侧栏">› 概念树</button>
          <span class="spacer"></span>
          <button type="button" id="btn-expand-right" class="icon-btn rail-toggle" hidden title="展开右侧栏" aria-label="展开右侧栏">检视 ‹</button>
        </div>
        <div class="stage-top">
          <div id="tabs" class="tabs"></div>
          <div id="toolbar" class="toolbar stage-tools"></div>
        </div>
      </div>
      <div id="editor-host" class="editor-wrap paper">
        <div class="empty empty-cta">
          <p class="empty-title">打开工作区，再选一个概念</p>
          <p class="empty-hint">左侧可切换或打开带有帐（.tent）的工作区；选中节点后在此阅读与编辑。</p>
        </div>
      </div>
    </main>

    <div
      class="splitter"
      id="splitter-right"
      role="separator"
      aria-orientation="vertical"
      aria-label="调整右侧栏宽度"
      aria-controls="side-panel"
      tabindex="0"
    ></div>

    <!-- 右栏：检视册 / 纸页 — 分节，非同质卡片堆 -->
    <aside class="sheet side-panel" id="side-panel" aria-label="检视与待处理">
      <header class="sheet-head">
        <h2 class="sheet-title">检视</h2>
        <button type="button" id="btn-collapse-right" class="icon-btn" title="收起右侧栏" aria-label="收起右侧栏" aria-controls="side-panel">›</button>
      </header>
      <div class="sheet-body">
        <section class="insp-block" aria-labelledby="insp-meta">
          <h3 id="insp-meta" class="insp-heading">属性</h3>
          <div id="meta" class="meta muted">未选择</div>
        </section>

        <section class="insp-block" aria-labelledby="insp-dispatch">
          <h3 id="insp-dispatch" class="insp-heading">派活</h3>
          <div id="dispatch-panel" class="dispatch-panel">
            <div class="muted dispatch-empty">选中协作框后可派活</div>
          </div>
        </section>

        <section class="insp-block" aria-labelledby="insp-tasks">
          <div class="insp-head-row">
            <h3 id="insp-tasks" class="insp-heading">任务 / 待裁</h3>
            <span id="task-count" class="count-pill" hidden>0</span>
          </div>
          <!-- A2U / U2A / session 容器位：后续主界面优先；本批不造后端模型 -->
          <div id="a2u-host" class="collab-slot" hidden aria-label="A2U 待处理"></div>
          <div id="u2a-host" class="collab-slot" hidden aria-label="U2A 追加输入"></div>
          <div id="session-host" class="collab-slot" hidden aria-label="会话状态"></div>
          <ul id="tasks" class="task-list"></ul>
        </section>

        <section class="insp-block" aria-labelledby="insp-cards">
          <h3 id="insp-cards" class="insp-heading">最近上下文卡 · 拖出</h3>
          <ul id="cards" class="card-list" aria-label="上下文卡列表，可拖到外部输入框"></ul>
        </section>
      </div>
    </aside>
  </div>
  <script type="module" src="./main-ui.js"></script>
</body>
</html>
