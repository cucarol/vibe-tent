<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>帷幄 · 浮动控件</title>
  <link rel="stylesheet" href="./float.css" />
</head>
<body class="float">
  <div class="float-shell">
    <header class="float-head">
      <div class="float-brand"><strong>帷幄</strong><span>浮动控件</span></div>
      <div class="float-head-actions">
        <button type="button" id="btn-open-main">打开主界面</button>
        <button type="button" id="btn-hide-float" aria-label="隐藏浮动控件" title="隐藏浮动控件">×</button>
      </div>
    </header>
    <div class="float-overview" aria-label="服务与任务状态">
      <span id="health-pill" class="pill loading" role="status" aria-live="polite">正在连接</span>
      <div class="metric"><span class="n" id="n-pending">—</span><span>待处理</span></div>
      <div class="metric"><span class="n" id="n-taken">—</span><span>进行中</span></div>
    </div>
    <div class="float-workspace"><span>工作区</span><span id="fg-root">正在读取…</span></div>
    <section class="float-context" aria-label="浮动通知">
      <strong>任务包在主界面</strong>
      <p>从 Node 或 Canvas 选择节点后，在右侧详情中委托。</p>
    </section>
  </div>
  <script type="module" src="./float-ui.js"></script>
</body>
</html>
