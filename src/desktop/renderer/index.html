<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>帷幄 · Tent</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!--
    一级：工作台 / 图谱 / 活动 / 设置（克制顶栏，非 dashboard 菜单堆砌）。
    工作台保留三栏 Nodes / Document / Inspector 与全部既有交互。
  -->
  <div id="app-root" class="app-root" data-surface="workbench">
    <nav class="app-nav" aria-label="主界面">
      <div class="app-nav-brand">
        <span class="brand">帷幄</span>
        <span class="brand-sub-inline" aria-hidden="true">纸研</span>
        <span id="health-pill" class="status-dot off" title="Local Service 状态" aria-label="服务离线"></span>
      </div>
      <div class="app-nav-tabs" role="tablist">
        <button type="button" class="app-nav-tab is-active" data-surface-nav="workbench" role="tab" aria-current="page">工作台</button>
        <button type="button" class="app-nav-tab" data-surface-nav="graph" role="tab">图谱</button>
        <button type="button" class="app-nav-tab" data-surface-nav="activity" role="tab">
          活动
          <span id="activity-badge" class="count-badge nav-badge" hidden>0</span>
        </button>
        <button type="button" class="app-nav-tab" data-surface-nav="settings" role="tab">设置</button>
      </div>
      <div class="app-nav-meta">
        <label class="sr-only" for="workspace-select">前台工作区</label>
        <select id="workspace-select" class="field field-compact" title="前台工作区"></select>
      </div>
    </nav>

    <div class="layout" id="main-layout">
      <!-- 左：Nodes -->
      <aside class="pane rail tree-panel" id="tree-panel" aria-label="Nodes">
        <header class="pane-head">
          <div class="pane-head-main">
            <span class="pane-kicker">Nodes</span>
          </div>
          <div class="pane-actions">
            <button type="button" id="btn-toggle-search" class="icon-btn" title="搜索" aria-label="搜索" aria-controls="search-drawer" aria-expanded="false">
              <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.2 10.2 13.5 13.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
            <button type="button" id="btn-toggle-create" class="icon-btn" title="新建" aria-label="新建" aria-controls="create-drawer" aria-expanded="false">
              <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.25v9.5M3.25 8h9.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
            <div class="menu-wrap">
              <button type="button" id="btn-rail-more" class="icon-btn" title="更多" aria-label="更多操作" aria-haspopup="menu" aria-expanded="false" aria-controls="rail-overflow">
                <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="4" cy="8" r="1.15" fill="currentColor"/><circle cx="8" cy="8" r="1.15" fill="currentColor"/><circle cx="12" cy="8" r="1.15" fill="currentColor"/></svg>
              </button>
              <div id="rail-overflow" class="menu" role="menu" hidden>
                <button type="button" id="btn-open-ws" class="menu-item" role="menuitem">打开工作区…</button>
                <button type="button" id="btn-refresh" class="menu-item" role="menuitem">刷新</button>
                <button type="button" id="btn-card" class="menu-item" role="menuitem">发出上下文卡</button>
                <button type="button" id="btn-float" class="menu-item" role="menuitem">浮动控件</button>
                <div class="menu-sep" role="separator"></div>
                <button type="button" id="btn-new-note" class="menu-item" role="menuitem">新建笔记</button>
              </div>
            </div>
          </div>
          <button type="button" id="btn-collapse-left" class="icon-btn collapse-edge" title="收起左侧栏" aria-label="收起左侧栏" aria-controls="tree-panel" aria-expanded="true">
            <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.75 3.75 5.5 8l4.25 4.25" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </header>

        <div id="search-drawer" class="drawer" hidden>
          <div class="drawer-row">
            <input id="search-input" class="field" placeholder="搜索" />
            <button type="button" id="btn-search" class="btn btn-secondary">搜索</button>
          </div>
          <ul id="search-hits" class="card-list search-hits"></ul>
        </div>

        <div id="create-drawer" class="drawer" hidden>
          <div class="drawer-row">
            <select id="create-type" class="field" title="可协调一级类型" aria-label="协作框类型"></select>
            <button type="button" id="btn-new-box" class="btn btn-primary" title="新建协作框">新建</button>
          </div>
        </div>

        <ul id="tree" class="tree" aria-label="概念树"></ul>
        <p id="status-line" class="status-line sr-live" aria-live="polite"></p>
      </aside>

      <div
        class="splitter"
        id="splitter-left"
        role="separator"
        aria-orientation="vertical"
        aria-label="调整左侧栏宽度"
        aria-controls="tree-panel"
        tabindex="0"
      ></div>

      <!-- 中：Document -->
      <main class="pane stage main-panel" id="main-panel" aria-label="Document" tabindex="-1">
        <header class="pane-head stage-head">
          <div class="main-rail-toggles" id="rail-toggles">
            <button type="button" id="btn-expand-left" class="icon-btn rail-toggle" hidden title="展开左侧栏" aria-label="展开左侧栏" aria-expanded="false">
              <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.25 3.75 10.5 8l-4.25 4.25" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" id="btn-expand-right" class="icon-btn rail-toggle" hidden title="展开右侧栏" aria-label="展开右侧栏" aria-expanded="false">
              <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.75 3.75 5.5 8l4.25 4.25" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div id="tabs" class="tabs"></div>
          <div id="toolbar" class="toolbar doc-actions"></div>
        </header>
        <div id="editor-host" class="editor-wrap paper">
          <div class="empty empty-cta">
            <p class="empty-title">打开工作区</p>
          </div>
        </div>
      </main>

      <div
        class="splitter"
        id="splitter-right"
        role="separator"
        aria-orientation="vertical"
        aria-label="调整右侧栏宽度"
        aria-controls="side-panel"
        tabindex="0"
      ></div>

      <!-- 右：检视 -->
      <aside class="pane sheet side-panel" id="side-panel" aria-label="检视">
        <header class="pane-head sheet-head">
          <div class="pane-head-main">
            <h2 class="pane-title sheet-title">检视</h2>
            <span id="task-count" class="count-badge" hidden>0</span>
          </div>
          <button type="button" id="btn-collapse-right" class="icon-btn collapse-edge" title="收起右侧栏" aria-label="收起右侧栏" aria-controls="side-panel" aria-expanded="true">
            <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.25 3.75 10.5 8l-4.25 4.25" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </header>

        <div class="sheet-body">
          <div id="meta" class="meta node-summary muted">未选择</div>

          <details class="insp-section" id="sec-pending">
            <summary class="insp-summary">
              <span>待处理</span>
            </summary>
            <div class="insp-body">
              <div id="a2u-host" class="collab-slot" hidden aria-label="A2U 待处理"></div>
              <div id="u2a-host" class="collab-slot" hidden aria-label="U2A 追加输入"></div>
              <div id="session-host" class="collab-slot" hidden aria-label="会话状态"></div>
              <ul id="tasks" class="task-list"></ul>
            </div>
          </details>

          <details class="insp-section" id="sec-dispatch">
            <summary class="insp-summary">
              <span>派活</span>
            </summary>
            <div class="insp-body">
              <div id="dispatch-panel" class="dispatch-panel">
                <div class="muted dispatch-empty">选中协作框后可派活</div>
              </div>
            </div>
          </details>

          <details class="insp-section" id="sec-cards">
            <summary class="insp-summary">
              <span>上下文卡</span>
            </summary>
            <div class="insp-body">
              <ul id="cards" class="card-list" aria-label="上下文卡列表"></ul>
            </div>
          </details>
        </div>
      </aside>
    </div>

    <!-- Secondary surfaces (hidden while workbench is active) -->
    <div id="secondary-host" class="secondary-host" hidden aria-hidden="true">
      <section id="surface-graph" class="surface-pane" hidden aria-label="图谱">
        <div id="graph-host" class="surface-host"></div>
      </section>
      <section id="surface-activity" class="surface-pane" hidden aria-label="活动">
        <div id="activity-host" class="surface-host"></div>
      </section>
      <section id="surface-settings" class="surface-pane" hidden aria-label="设置">
        <div id="settings-host" class="surface-host"></div>
      </section>
    </div>
  </div>
  <script type="module" src="./main-ui.js"></script>
</body>
</html>
